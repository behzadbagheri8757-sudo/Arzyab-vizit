<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ارزیاب مغازه‌ها</title>
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F1F0EC; --text:#1C1C1E; --muted:#6B6B70; --border:#E4E3DE;
    --accent:#1E6B55; --accent-text:#FFFFFF; --danger:#C64B4B;
    --rank-a-plus:#0F7A4A; --rank-a:#2E9A5C; --rank-b:#3B7DD8; --rank-c:#D98A22; --rank-d:#C64B4B;
    --radius:14px; --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
  }
  html[data-theme="dark"]{
    --bg:#101211; --surface:#1B1E1C; --surface-2:#20241F; --text:#EDEDEA; --muted:#9A9A96; --border:#2C302D;
    --accent:#35A085; --accent-text:#08110D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
    font-size:15px; line-height:1.6;
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important;} }
  #app{display:flex; flex-direction:column; min-height:100vh;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
    padding:calc(10px + var(--safe-top)) 16px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar h1{font-size:17px; margin:0; font-weight:700;}
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer;
  }
  main#view-root{flex:1; padding:14px 14px calc(96px + var(--safe-bottom)); max-width:640px; margin:0 auto; width:100%;}
  nav#bottom-nav{
    position:fixed; bottom:0; right:0; left:0; z-index:30; background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding-bottom:var(--safe-bottom);
  }
  nav#bottom-nav button{
    flex:1; background:none; border:none; color:var(--muted); padding:9px 2px 8px; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:inherit;
  }
  nav#bottom-nav button .ic{font-size:19px;}
  nav#bottom-nav button.active{color:var(--accent); font-weight:700;}
  h2.view-title{font-size:19px; margin:2px 0 14px; font-weight:700;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .field-label{font-size:12.5px; color:var(--muted); margin:0 0 8px; font-weight:600;}
  input[type=text],input[type=search],input[type=number]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); font-size:16px; font-family:inherit;
  }
  input:focus-visible, button:focus-visible, select:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:11px;
    padding:11px 14px; font-size:14px; cursor:pointer; font-family:inherit; min-height:44px; line-height:1.35;
    text-align:right; flex:0 0 auto;
  }
  .chip.chip-selected{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:700;}
  .chip.chip-block{flex:1 1 100%;}
  .q-block{margin-bottom:18px; padding-bottom:16px; border-bottom:1px dashed var(--border);}
  .q-block:last-of-type{border-bottom:none; margin-bottom:6px;}
  .q-num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
    background:var(--surface-2); font-size:11px; margin-inline-start:6px; color:var(--muted); font-weight:700;}
  .q-title{font-size:14.5px; font-weight:700; margin-bottom:9px;}
  .live-score{
    position:sticky; top:56px; z-index:15; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .live-score .num{font-size:26px; font-weight:800;}
  .live-score .rank-badge{padding:5px 12px; border-radius:20px; color:#fff; font-weight:800; font-size:14px;}
  .live-score .sub{font-size:11.5px; color:var(--muted);}
  .btn{
    border:none; border-radius:13px; padding:14px 16px; font-size:15.5px; font-weight:700; cursor:pointer;
    font-family:inherit; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--accent); color:var(--accent-text);}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1.5px solid var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}
  .sticky-save{position:sticky; bottom:calc(8px + var(--safe-bottom)); padding-top:6px;}
  .shop-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:9px; cursor:pointer;
  }
  .shop-row .meta{min-width:0;}
  .shop-row .name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .shop-row .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .rank-pill{padding:5px 11px; border-radius:20px; color:#fff; font-weight:800; font-size:13px; flex-shrink:0;}
  .row-inline{display:flex; gap:8px; margin-bottom:10px;}
  select{
    padding:11px 12px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    font-size:14px; font-family:inherit; flex:1;
  }
  .empty-state{text-align:center; padding:40px 16px; color:var(--muted);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .stat-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px; text-align:center;}
  .stat-box .n{font-size:22px; font-weight:800;}
  .stat-box .l{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .rank-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .badge-sm{width:34px; height:26px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px;}
  .timeline-item{position:relative; padding-inline-end:16px; padding-bottom:16px; border-inline-end:2px solid var(--border); margin-inline-end:9px;}
  .timeline-item:last-child{border-color:transparent; padding-bottom:0;}
  .timeline-item::before{content:''; position:absolute; inset-inline-end:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--accent);}
  .timeline-date{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .timeline-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .tag-pill{font-size:11.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:3px 9px;}
  .toast{
    position:fixed; bottom:calc(74px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:700;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .converted-banner{background:var(--rank-a-plus); color:#fff; border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; font-weight:700; font-size:14px;}
  .accordion-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:2px 0;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:flex; align-items:flex-end;}
  .sheet{background:var(--surface); width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + var(--safe-bottom));}
  .sheet h3{margin:0 0 12px; font-size:16px;}
  textarea.copy-area{width:100%; height:160px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); padding:10px; font-size:13px; font-family:inherit;}
  .link-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; padding:6px 2px;}
  .neigh-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .neigh-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:9px; padding:8px 10px; font-size:13.5px;}
  .answer-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .answer-row:last-child{border-bottom:none;}
  .answer-row .q{color:var(--muted); flex:1;}
  .answer-row .a{font-weight:700; text-align:left;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>🌿 ارزیاب مغازه‌ها</h1>
    <button class="icon-btn" id="theme-toggle" aria-label="تغییر تم">🌙</button>
  </header>
  <main id="view-root"></main>
  <nav id="bottom-nav">
    <button data-nav="entry"><span class="ic">✍️</span>ثبت</button>
    <button data-nav="list"><span class="ic">📋</span>لیست</button>
    <button data-nav="dashboard"><span class="ic">📊</span>داشبورد</button>
    <button data-nav="routes"><span class="ic">🗺️</span>مسیرها</button>
    <button data-nav="settings"><span class="ic">⚙️</span>تنظیمات</button>
  </nav>
  <div class="toast" id="toast"></div>
  <div id="overlay-root"></div>
</div>

<script>
'use strict';

/* ============================================================
   بخش ۱: تنظیمات کلی و سیستم امتیازدهی
   ============================================================ */
const APP_VERSION = '1.0';
const DB_NAME = 'ProspectScoutDB';
const DB_VERSION = 1;
const SCORING_VERSION = 1;

const QUESTIONS = [
  { id:'q1', label:'نوع و اندازه مغازه', weight:10, options:[
    {key:'super_big',     label:'سوپر بزرگ', score:10},
    {key:'resto_active',  label:'رستوران / آشپزخانه پرکار', score:8},

    {key:'nuts_shop',     label:'آجیل و خشکبارفروشی', score:4},
    {key:'other_ok',      label:'سایر — مناسب', score:2},
    {key:'other_bad',     label:'سایر — نامناسب', score:1},
  ]},
  { id:'q2', label:'حجم فعلی فروش حبوبات و خشکبار', weight:18, options:[
    {key:'huge', label:'خیلی زیاد', score:18},
    {key:'high', label:'زیاد', score:14},
    {key:'mid',  label:'متوسط', score:9},
    {key:'low',  label:'کم', score:4},
    {key:'none', label:'تقریباً صفر', score:1},
  ]},
  { id:'q3', label:'وضعیت تأمین‌کننده فعلی', weight:10, options:[
    {key:'none_fixed', label:'تأمین‌کننده ثابت ندارد', score:10},

    {key:'no_supplier',  label:'تأمین‌کننده ثابت ندارد', score:9},
    {key:'very_unhappy', label:'خیلی ناراضی', score:8},
    {key:'unhappy',      label:'ناراضی', score:6},

    {key:'happy',        label:'راضی', score:2},

  ]},
  { id:'q5', label:'دسترسی به تصمیم‌گیرنده', weight:8, options:[
    {key:'owner_present', label:'صاحب مغازه بود', score:8},
    {key:'manager_full',  label:'مسئول خرید بود', score:6},
    {key:'needs_coord',   label:'نیاز به هماهنگی دارد', score:3},
    {key:'absent',        label:'تصمیم‌گیرنده حضور نداشت', score:1},
  ]},
  { id:'q6', label:'تمایل به امتحان تأمین‌کننده جدید', weight:12, options:[
    {key:'eager',      label:'مشتاق', score:12},
    {key:'interested', label:'علاقه‌مند', score:8},
    {key:'hesitant',   label:'هنوز تردید دارد', score:4},
    {key:'closed',     label:'کاملاً بسته و مخالف', score:0},
  ]},
  { id:'q7', label:'شرایط پرداخت', weight:16, options:[
    {key:'cash_weekly',  label:'نقدی / تسویه هفتگی', score:16},
    {key:'next_invoice', label:'تسویه تا فاکتور بعدی', score:11},
    {key:'d15_30',       label:'چک یا تسویه ۱۵ تا ۳۰ روزه', score:6},
    {key:'long_or_bad',  label:'چک/طلب بالای ۳۰ روز یا مشکل‌دار', score:1},
  ]},
  { id:'q8', label:'فضای نمایش و نگهداری کالا', weight:6, options:[
    {key:'dedicated', label:'فضای اختصاصی حبوبات و خشکبار', score:6},
    {key:'partial',   label:'فقط برای حبوبات یا خشکبار جا دارد', score:4},
    {key:'mid_low',   label:'فضای متوسط یا کم', score:2},
    {key:'none',      label:'فضای مناسب برای این کالاها ندارد', score:0},
  ]},
  { id:'q9', label:'موقعیت مکانی و ترافیک مشتری', weight:6, options:[
    {key:'main',   label:'خیابان اصلی / کنار جاده', score:6},
    {key:'dense',  label:'داخل محله پرجمعیت / پرمصرف', score:4},
    {key:'normal', label:'محله یا موقعیت معمولی', score:2},
    {key:'quiet',  label:'جای خلوت', score:1},
  ]},
  { id:'q10', label:'احتمال سفارش تکراری', weight:5, options:[
    {key:'very_high', label:'بسیار بالا', score:5},
    {key:'high',      label:'بالا', score:3},
    {key:'mid_low',   label:'متوسط / پایین', score:1},
    {key:'unknown',   label:'نامشخص', score:0},
  ]},
];

const VISIT_TAGS = [
  {key:'price_list',      label:'اطلاعات گرفت — لیست قیمت / شماره'},
  {key:'sample',          label:'گفت سربزن'},
  {key:'owner_absent',    label:'تصمیم‌گیرنده نبود'},
  {key:'rejected',        label:'رد کرد'},
  {key:'became_customer', label:'خرید کرد'},
];

const RANK_INFO = {
  'A+': {color:'var(--rank-a-plus)', desc:'اولویت مطلق – ویزیت فوری و پیگیری سنگین'},
  'A':  {color:'var(--rank-a)', desc:'اولویت بالا – پیگیری جدی در ۷ روز آینده'},
  'B':  {color:'var(--rank-b)', desc:'متوسط رو به بالا – پیگیری عادی'},
  'C':  {color:'var(--rank-c)', desc:'اولویت پایین – فقط در صورت آزاد بودن زمان'},
  'D':  {color:'var(--rank-d)', desc:'فعلاً ارزش پیگیری ندارد'},
};

function scoreToRank(score){
  if(score>=90) return 'A+';
  if(score>=75) return 'A';
  if(score>=55) return 'B';
  if(score>=35) return 'C';
  return 'D';
}
function computeScore(answers){
  let total=0;
  QUESTIONS.forEach(q=>{
    const opt = q.options.find(o=>o.key===answers[q.id]);
    if(opt) total += opt.score;
  });
  return total;
}
function answeredCount(answers){
  return QUESTIONS.filter(q=>answers[q.id]).length;
}

/* ============================================================
   بخش ۲-ب: تارگت روزانهٔ ویزیت + پیام‌های انگیزشی
   ============================================================ */
const MILESTONE_MESSAGES = {
  '50': [
    'نصف راه امروز رو رفتی! همینطور ادامه بده 💪',
    'رسیدی به نصف تارگت — سرعتت خوبه',
    'نیمهٔ مسیر امروز تموم شد',
    'نصف تارگت جا موند سرت، برو نصف دیگه',
    'نصف راه رو رد کردی، تا تارگت خیلی نمونده',
  ],
  '80': [
    'به تارگت نزدیک شدی! چندتا دیگه مونده',
    'داری به تارگت امروز می‌رسی — یه فشار آخر بده',
    'خیلی نزدیکی به هدف امروز، ول نکن',
    'تارگت امروز داره دستت میاد',
    'یکی‌دو مغازهٔ دیگه و تارگت امروز کامل میشه',
  ],
  '100': [
    'تارگت امروز رو زدی! 🎯 آفرین',
    'تموم شد — به عددی که گذاشته بودی رسیدی 🎉',
    'هدف امروز کامل شد، خسته نباشی',
    'تارگت امروز پر شد، کارت عالی بود',
    'رسیدی به همون عددی که خودت تعیین کرده بودی 👏',
  ],
  'over': [
    'از تارگت هم رد شدی، امروز روز خیلی خوبیه 🔥',
    'بیشتر از برنامه‌ات زدی، همینطور ادامه بده',
    'تارگت رو رد کردی و همچنان داری می‌زنی',
    'امروز فراتر از انتظار خودت کار کردی',
    'رکورد امروزت از تارگت بالاتر رفت 👌',
  ],
};
const MILESTONE_EMOJI = {'50':'🚶','80':'⚡','100':'🎯','over':'🔥'};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function defaultDailyTarget(prevTarget, prevLastMsg){
  return { date: todayStr(), target: prevTarget||0, count:0, hit:{}, lastMsg: prevLastMsg||{} };
}
async function ensureDailyTarget(){
  let rec = await dbGet('meta','dailyTarget');
  let dt = rec ? rec.value : null;
  if(!dt || dt.date !== todayStr()){
    dt = defaultDailyTarget(dt?dt.target:0, dt?dt.lastMsg:{});
    await dbPut('meta', {key:'dailyTarget', value:dt});
  }
  state.dailyTarget = dt;
  return dt;
}
async function persistDailyTarget(dt){
  state.dailyTarget = dt;
  await dbPut('meta', {key:'dailyTarget', value:dt});
}
async function setDailyTargetValue(newTarget){
  const dt = await ensureDailyTarget();
  dt.target = newTarget;
  await persistDailyTarget(dt);
}
async function startNewTargetDay(){
  const dt = await ensureDailyTarget();
  dt.count = 0;
  dt.hit = {};
  await persistDailyTarget(dt);
}
function pickMilestoneMessage(category, dt){
  const pool = MILESTONE_MESSAGES[category];
  let idx = Math.floor(Math.random()*pool.length);
  if(pool.length>1 && dt.lastMsg && dt.lastMsg[category]===idx){
    idx = (idx+1)%pool.length;
  }
  dt.lastMsg = dt.lastMsg || {};
  dt.lastMsg[category] = idx;
  return pool[idx];
}
function showMilestoneMessage(category, dt){
  const msg = pickMilestoneMessage(category, dt);
  openOverlay(
    '<div style="text-align:center; padding:6px 0 4px">'+
      '<div style="font-size:36px; margin-bottom:8px">'+MILESTONE_EMOJI[category]+'</div>'+
      '<h3 style="margin-bottom:8px">'+esc(msg)+'</h3>'+
      '<div style="color:var(--muted); font-size:13px; margin-bottom:14px">'+faNum(dt.count)+' از '+faNum(dt.target)+' ویزیت امروز</div>'+
      '<button class="btn btn-primary" data-action="closeOverlay">ادامه</button>'+
    '</div>'
  );
}
let lastVisitShowedMilestone = false;
async function registerVisitForTarget(){
  lastVisitShowedMilestone = false;
  const dt = await ensureDailyTarget();
  dt.count += 1;
  if(dt.target > 0){
    const pct = (dt.count/dt.target)*100;
    let category = null;
    if(pct>=100 && !dt.hit['100']){ category='100'; dt.hit['100']=true; }
    else if(pct>=80 && !dt.hit['80']){ category='80'; dt.hit['80']=true; }
    else if(pct>=50 && !dt.hit['50']){ category='50'; dt.hit['50']=true; }
    else if(pct>100 && dt.hit['100'] && !dt.hit['over'] && (dt.count-dt.target)>=3){ category='over'; dt.hit['over']=true; }
    if(category){
      await persistDailyTarget(dt);
      showMilestoneMessage(category, dt);

   ============================================================ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function faNum(n){ try{ return Number(n).toLocaleString('fa-IR'); }catch(e){ return String(n); } }
function faDate(iso){
  try{
    const d = new Date(iso);
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }catch(e){
    return (iso||'').slice(0,10);
  }
}
function faDateTime(iso){
  try{
    const d = new Date(iso);
    const date = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
    const time = new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(d);
    return date+' - '+time;
  }catch(e){ return (iso||''); }
}
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function closeOverlay(){ document.getElementById('overlay-root').innerHTML=''; }
function openOverlay(innerHtml){

    '<div class="overlay" data-action="closeOverlayBg"><div class="sheet">'+innerHtml+'</div></div>';
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast('کپی شد ✅');
    return;
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ showToast('کپی شد ✅'); return; }
  }catch(e){}
  openOverlay(
    '<h3>کپی گزارش</h3><p class="field-label">کپی خودکار ممکن نشد؛ متن زیر را انتخاب و کپی کنید:</p>'+

  );

/* ============================================================
   بخش ۳: لایه IndexedDB
   ============================================================ */
let dbInstance = null;
function openDatabase(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('shops')) db.createObjectStore('shops',{keyPath:'id'});
      if(!db.objectStoreNames.contains('routes')) db.createObjectStore('routes',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e)=>{ reject(e.target.error); };
  });
}
function storeOf(name, mode){ return dbInstance.transaction(name, mode).objectStore(name); }
function dbGetAll(name){
  return new Promise((resolve,reject)=>{
    const r = storeOf(name,'readonly').getAll();
    r.onsuccess=()=>resolve(r.result||[]); r.onerror=()=>reject(r.error);
  });
}
function dbGet(name,key){
  return new Promise((resolve,reject)=>{
    const r = storeOf(name,'readonly').get(key);
    r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error);
  });
}
function dbPut(name,value){
  return new Promise((resolve,reject)=>{
    const r = storeOf(name,'readwrite').put(value);
    r.onsuccess=()=>resolve(value); r.onerror=()=>reject(r.error);
  });
}
function dbDelete(name,key){
  return new Promise((resolve,reject)=>{
    const r = storeOf(name,'readwrite').delete(key);
    r.onsuccess=()=>resolve(true); r.onerror=()=>reject(r.error);
  });
}
function dbReplaceAll(name, items){
  return new Promise((resolve,reject)=>{
    const tx = dbInstance.transaction(name,'readwrite');
    const os = tx.objectStore(name);
    os.clear();
    items.forEach(it=>os.put(it));
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
}

/* ============================================================
   بخش ۴: نرمال‌سازی داده‌ها (سازگاری به عقب و آینده)
   ============================================================ */
function normalizeVisit(raw){
  return {
    id: raw.id || uid(),
    date: raw.date || nowISO(),
    answers: (raw.answers && typeof raw.answers==='object') ? raw.answers : {},
    score: typeof raw.score==='number' ? raw.score : 0,
    rank: raw.rank || scoreToRank(typeof raw.score==='number'?raw.score:0),
    scoringVersion: raw.scoringVersion || 1,
    tags: Array.isArray(raw.tags) ? raw.tags : [],
  };
}
function normalizeShop(raw){
  return {
    id: raw.id || uid(),
    schemaVersion: 1,
    name: raw.name || '(بدون نام)',
    routeId: raw.routeId || null,
    neighborhoodId: raw.neighborhoodId || null,
    status: raw.status==='converted' ? 'converted' : 'active',
    createdAt: raw.createdAt || nowISO(),
    updatedAt: raw.updatedAt || raw.createdAt || nowISO(),
    latestScore: typeof raw.latestScore==='number' ? raw.latestScore : 0,
    latestRank: raw.latestRank || scoreToRank(typeof raw.latestScore==='number'?raw.latestScore:0),
    visits: Array.isArray(raw.visits) ? raw.visits.map(normalizeVisit) : [],
  };
}
function normalizeRoute(raw){
  return {
    id: raw.id || uid(),
    schemaVersion: 1,
    name: raw.name || '(بدون نام)',
    createdAt: raw.createdAt || nowISO(),
    neighborhoods: Array.isArray(raw.neighborhoods) ? raw.neighborhoods.map(n=>({id:n.id||uid(), name:n.name||''})) : [],
  };
}

   ============================================================ */
function routeName(routeId){
  const r = state.routes.find(x=>x.id===routeId);
  return r ? r.name : '—';
}
function neighborhoodName(routeId, neighborhoodId){
  const r = state.routes.find(x=>x.id===routeId);
  if(!r) return '—';
  const n = r.neighborhoods.find(x=>x.id===neighborhoodId);
  return n ? n.name : '—';
}
async function persistShop(shop){
  shop.updatedAt = nowISO();
  await dbPut('shops', shop);
}
async function createShopFromForm(){
  const score = computeScore(formState.answers);
  const rank = scoreToRank(score);
  const visit = normalizeVisit({date: nowISO(), answers:{...formState.answers}, score, rank, scoringVersion:SCORING_VERSION, tags:[...formState.tags]});
  const shop = normalizeShop({
    name: formState.name.trim(),
    routeId: formState.routeId,
    neighborhoodId: formState.neighborhoodId,
    latestScore: score, latestRank: rank,
    visits: [visit],
    status: formState.tags.includes('became_customer') ? 'converted' : 'active',
  });
  await persistShop(shop);
  state.shops.push(shop);
  await registerVisitForTarget();
  return shop;
}
async function addVisitFromForm(){
  const shop = state.shops.find(s=>s.id===formState.shopId);
  if(!shop) return null;
  const score = computeScore(formState.answers);
  const rank = scoreToRank(score);
  const visit = normalizeVisit({date: nowISO(), answers:{...formState.answers}, score, rank, scoringVersion:SCORING_VERSION, tags:[...formState.tags]});
  shop.visits.push(visit);
  shop.latestScore = score;
  shop.latestRank = rank;
  if(formState.tags.includes('became_customer')) shop.status = 'converted';
  await persistShop(shop);
  await registerVisitForTarget();
  return shop;
}
async function deleteShop(id){
  state.shops = state.shops.filter(s=>s.id!==id);
  await dbDelete('shops', id);
}
async function deleteVisit(shopId, visitId){
  const shop = state.shops.find(s=>s.id===shopId);
  if(!shop) return;
  shop.visits = shop.visits.filter(v=>v.id!==visitId);
  if(shop.visits.length){
    const last = shop.visits[shop.visits.length-1];
    shop.latestScore = last.score; shop.latestRank = last.rank;
    if(!shop.visits.some(v=>v.tags.includes('became_customer'))) shop.status='active';
  } else {
    shop.latestScore = 0; shop.latestRank = 'D';
  }
  await persistShop(shop);
}

      await createShopFromForm();
      if(!lastVisitShowedMilestone) showToast('مغازه ثبت شد ✅');
      resetEntryFormForNew(true);
      render();
      const nameInput = document.getElementById('shop-name-input');
      if(nameInput) nameInput.focus();
    }
  } catch(e){
    showToast('خطا در ذخیره‌سازی ⚠️');
    if(btn) btn.disabled = false;
  }
}

   بخش ۱۰: رندر - لیست مغازه‌ها

function getFilteredSortedShops(){
  let list = state.shops.slice();
  const q = state.listSearch.trim();
  if(q) list = list.filter(s=>s.name.includes(q));
  if(state.listFilterRoute) list = list.filter(s=>s.routeId===state.listFilterRoute);
  if(state.listFilterRank) list = list.filter(s=>s.latestRank===state.listFilterRank);
  switch(state.listSort){
    case 'score_desc': list.sort((a,b)=>b.latestScore-a.latestScore); break;
    case 'score_asc': list.sort((a,b)=>a.latestScore-b.latestScore); break;
    case 'name': list.sort((a,b)=>a.name.localeCompare(b.name,'fa')); break;
    case 'date_desc': list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)); break;
    case 'date_asc': list.sort((a,b)=>new Date(a.updatedAt)-new Date(b.updatedAt)); break;
    case 'route': list.sort((a,b)=>routeName(a.routeId).localeCompare(routeName(b.routeId),'fa')); break;
  }
  return list;
}
function renderListView(){
  let html = '<h2 class="view-title">لیست مغازه‌ها ('+faNum(state.shops.length)+')</h2>';
  html += '<input type="search" id="list-search-input" placeholder="جستجوی نام مغازه…" value="'+esc(state.listSearch)+'" style="margin-bottom:10px">';
  html += '<div class="row-inline">'+
    '<select id="sort-select">'+
      '<option value="score_desc"'+(state.listSort==='score_desc'?' selected':'')+'>امتیاز (زیاد به کم)</option>'+
      '<option value="score_asc"'+(state.listSort==='score_asc'?' selected':'')+'>امتیاز (کم به زیاد)</option>'+
      '<option value="date_desc"'+(state.listSort==='date_desc'?' selected':'')+'>جدیدترین</option>'+
      '<option value="date_asc"'+(state.listSort==='date_asc'?' selected':'')+'>قدیمی‌ترین</option>'+
      '<option value="name"'+(state.listSort==='name'?' selected':'')+'>نام</option>'+
      '<option value="route"'+(state.listSort==='route'?' selected':'')+'>مسیر</option>'+
    '</select>'+
    '<select id="filter-route-select">'+
      '<option value="">همه مسیرها</option>'+
      state.routes.map(r=>'<option value="'+esc(r.id)+'"'+(state.listFilterRoute===r.id?' selected':'')+'>'+esc(r.name)+'</option>').join('')+
    '</select>'+

  html += '<div class="row-inline"><select id="filter-rank-select" style="flex:1">'+
    '<option value="">همه رتبه‌ها</option>'+
    ['A+','A','B','C','D'].map(r=>'<option value="'+r+'"'+(state.listFilterRank===r?' selected':'')+'>رتبه '+r+'</option>').join('')+
    '</select></div>';
  html += '<div id="list-results">'+renderListResultsInner()+'</div>';
  return html;
}
function renderListResultsInner(){
  const list = getFilteredSortedShops();
  if(list.length===0){

function buildShopReportText(shop){
  const lastVisit = shop.visits[shop.visits.length-1];
  let lines = [];
  lines.push('گزارش مغازه: '+shop.name);
  lines.push('مسیر: '+routeName(shop.routeId)+' — محله: '+neighborhoodName(shop.routeId, shop.neighborhoodId));
  lines.push('امتیاز فعلی: '+shop.latestScore+' — رتبه: '+shop.latestRank+' ('+RANK_INFO[shop.latestRank].desc+')');
  lines.push('وضعیت: '+(shop.status==='converted' ? 'مشتری شده' : 'در حال پیگیری'));
  lines.push('');
  if(lastVisit){
    lines.push('پاسخ‌های آخرین ویزیت:');
    QUESTIONS.forEach(q=>{
      const opt = q.options.find(o=>o.key===lastVisit.answers[q.id]);
      lines.push('- '+q.label+': '+(opt?opt.label:'—'));
    });
    lines.push('');
  }
  lines.push('سوابق ویزیت:');
  shop.visits.forEach((v,idx)=>{
    let tagsTxt = v.tags.map(tk=>{ const t=VISIT_TAGS.find(x=>x.key===tk); return t?t.label:tk; }).join('، ');
    lines.push('ویزیت '+(idx+1)+' — '+faDate(v.date)+' — امتیاز '+v.score+(tagsTxt?' — '+tagsTxt:''));
  });
  return lines.join('\n');
}

    });
  }
  html += '</div>';
  return html;
}

async function exportBackup(){
  const payload = { appVersion:APP_VERSION, exportedAt:nowISO(), routes:state.routes, shops:state.shops };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'prospects-backup-'+nowISO().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('فایل بکاپ دانلود شد ✅');
}
function validateBackupShape(obj){
  return obj && typeof obj==='object' && Array.isArray(obj.shops) && Array.isArray(obj.routes);
}
async function importBackupFile(file){
  const preRestoreSnapshot = { routes: state.routes, shops: state.shops, savedAt: nowISO() };
  try{
    await dbPut('meta', {key:'preRestoreSnapshot', value:preRestoreSnapshot});
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!validateBackupShape(parsed)) throw new Error('bad-shape');
    const newShops = parsed.shops.map(normalizeShop);
    const newRoutes = parsed.routes.map(normalizeRoute);
    await dbReplaceAll('shops', newShops);
    await dbReplaceAll('routes', newRoutes);
    state.shops = newShops;
    state.routes = newRoutes;
    showToast('بازیابی با موفقیت انجام شد ✅');
    render();
  } catch(e){
    try{
      await dbReplaceAll('shops', preRestoreSnapshot.shops);
      await dbReplaceAll('routes', preRestoreSnapshot.routes);
      state.shops = preRestoreSnapshot.shops;
      state.routes = preRestoreSnapshot.routes;
    }catch(e2){}
    showToast('فایل بکاپ نامعتبر است ⚠️ — اطلاعات قبلی حفظ شد');
  }
}

function render(){
  const root = document.getElementById('view-root');
  switch(state.view){
    case 'entry': root.innerHTML = renderEntryView(); break;
    case 'list': root.innerHTML = renderListView(); break;
    case 'detail': root.innerHTML = renderDetailView(); break;
    case 'dashboard': root.innerHTML = renderDashboardView(); break;
    case 'routes': root.innerHTML = renderRoutesView(); break;
    case 'settings': root.innerHTML = renderSettingsView(); break;
  }
  document.querySelectorAll('#bottom-nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav===state.view);
  });
  if(state.view==='entry'){
    updateSaveButtonState();
    const nameInput = document.getElementById('shop-name-input');
    if(nameInput && formState.mode==='new') nameInput.focus();
  }
}
function goTo(view){
  if(view==='entry' && formState.mode==='visit'){ resetEntryFormForNew(true); }
  state.view = view;
  if((view==='entry' || view==='dashboard') && (!state.dailyTarget || state.dailyTarget.date!==todayStr())){
    ensureDailyTarget().then(render);
  }
  render();
}

  if(e.target.id==='filter-route-select'){ state.listFilterRoute = e.target.value; document.getElementById('list-results').innerHTML = renderListResultsInner(); }
  if(e.target.id==='filter-rank-select'){ state.listFilterRank = e.target.value; document.getElementById('list-results').innerHTML = renderListResultsInner(); }
  if(e.target.id==='import-file-input' && e.target.files[0]){ importBackupFile(e.target.files[0]); }
});

function onChipClick(el){
  const group = el.dataset.chip;
  const value = el.dataset.value;
  const multi = el.dataset.multi==='1';
  if(group==='route'){
    formState.routeId = value;
    formState.neighborhoodId = null;
    updateChipGroupSingle('route', value);
    const card = document.getElementById('neighborhood-card');
    if(card){ card.style.display=''; document.getElementById('neighborhood-chips').innerHTML = renderNeighborhoodChipsInner(); }
    updateSaveButtonState();
  } else if(group==='neighborhood'){
    formState.neighborhoodId = value;
    updateChipGroupSingle('neighborhood', value);
  } else if(group==='tags'){
    const i = formState.tags.indexOf(value);
    if(i>=0) formState.tags.splice(i,1); else formState.tags.push(value);
    updateChipGroupMulti('tags', formState.tags);
  } else if(group.startsWith('q')){
    formState.answers[group] = value;
    updateChipGroupSingle(group, value);
    updateLiveScoreUI();
  }
}
function onAction(el){
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch(action){
    case 'goRoutes': goTo('routes'); break;
    case 'saveEntry': handleSaveEntry(); break;
    case 'cancelVisit': resetEntryFormForNew(true); render(); break;
    case 'openDetail': state.detailShopId = id; state.view='detail'; render(); break;
    case 'backToList': state.view='list'; render(); break;
    case 'startVisit': loadEntryFormForVisit(id); state.view='entry'; render(); break;
    case 'copyReport': {
      const shop = state.shops.find(s=>s.id===id);
      if(shop) copyText(buildShopReportText(shop));
      break;
    }
    case 'editShop': openEditShopSheet(id); break;
    case 'saveShopEdit': saveShopEditFromSheet(); break;
    case 'askDeleteShop': confirmDeleteShop(id); break;
    case 'confirmDeleteShopYes': doDeleteShop(id); break;
    case 'askDeleteVisit': confirmDeleteVisit(id, el.dataset.visit); break;
    case 'confirmDeleteVisitYes': doDeleteVisit(id, el.dataset.visit); break;
    case 'closeOverlay': closeOverlay(); break;
    case 'closeOverlayBg': if(el===document.querySelector('.overlay')) closeOverlay(); break;
    case 'addRouteClick': handleAddRouteClick(); break;
    case 'toggleRoute': routesViewState.expanded[id] = !routesViewState.expanded[id]; render(); break;
    case 'startEditRoute': routesViewState.editingRoute = id; render(); break;
    case 'saveRouteName': handleSaveRouteName(id); break;
    case 'askDeleteRoute': confirmDeleteRoute(id); break;
    case 'confirmDeleteRouteYes': doDeleteRoute(id); break;
    case 'addNeighClick': handleAddNeighClick(id); break;
    case 'startEditNeigh': routesViewState.editingNeigh = el.dataset.neigh; render(); break;
    case 'saveNeighName': handleSaveNeighName(el.dataset.route, el.dataset.neigh); break;
    case 'askDeleteNeigh': confirmDeleteNeigh(el.dataset.route, el.dataset.neigh); break;
    case 'confirmDeleteNeighYes': doDeleteNeigh(el.dataset.route, el.dataset.neigh); break;
    case 'toggleThemeSettings': toggleTheme(); render(); break;
    case 'exportBackup': exportBackup(); break;
    case 'triggerImport': document.getElementById('import-file-input').click(); break;
    case 'openTargetSheet': openTargetSheet(); break;
    case 'saveTargetValue': handleSaveTargetValue(); break;
    case 'askStartNewDay': confirmStartNewDay(); break;
    case 'confirmStartNewDayYes': handleStartNewDayConfirmed(); break;
  }
}

/* ---- توابع کمکی اکشن‌های بالا ---- */
function handleAddRouteClick(){
  const input = document.getElementById('new-route-input');
  const name = (input.value||'').trim();
  if(!name){ showToast('نام مسیر را وارد کن'); return; }
  addRoute(name).then(()=>{ render(); showToast('مسیر اضافه شد ✅'); });
}
function handleSaveRouteName(id){
  const input = document.getElementById('edit-route-input');
  const name = (input.value||'').trim();
  if(!name){ showToast('نام نمی‌تواند خالی باشد'); return; }
  renameRoute(id, name).then(()=>{ routesViewState.editingRoute=null; render(); showToast('ذخیره شد ✅'); });
}
function handleAddNeighClick(routeId){
  const input = document.getElementById('new-neigh-input-'+routeId);
  const name = (input.value||'').trim();
  if(!name){ showToast('نام محله را وارد کن'); return; }
  addNeighborhood(routeId, name).then(()=>{ render(); showToast('محله اضافه شد ✅'); });
}
function handleSaveNeighName(routeId, neighId){
  const input = document.getElementById('edit-neigh-input');
  const name = (input.value||'').trim();
  if(!name){ showToast('نام نمی‌تواند خالی باشد'); return; }
  renameNeighborhood(routeId, neighId, name).then(()=>{ routesViewState.editingNeigh=null; render(); showToast('ذخیره شد ✅'); });
}
function confirmDeleteRoute(id){
  const r = state.routes.find(x=>x.id===id);
  openOverlay('<h3>حذف مسیر</h3><p>مسیر «'+esc(r?r.name:'')+'» حذف شود؟ مغازه‌های موجود در این مسیر حذف نمی‌شوند، فقط مسیرشان خالی می‌ماند.</p>'+
    '<div class="btn-row"><button class="btn btn-secondary" data-action="closeOverlay">انصراف</button>'+
    '<button class="btn btn-danger" data-action="confirmDeleteRouteYes" data-id="'+esc(id)+'">حذف مسیر</button></div>');
}
function doDeleteRoute(id){ deleteRouteById(id).then(()=>{ closeOverlay(); render(); showToast('مسیر حذف شد'); }); }
function confirmDeleteNeigh(routeId, neighId){
  openOverlay('<h3>حذف محله</h3><p>این محله حذف شود؟</p>'+
    '<div class="btn-row"><button class="btn btn-secondary" data-action="closeOverlay">انصراف</button>'+
    '<button class="btn btn-danger" data-action="confirmDeleteNeighYes" data-route="'+esc(routeId)+'" data-neigh="'+esc(neighId)+'">حذف</button></div>');
}
function doDeleteNeigh(routeId, neighId){ deleteNeighborhoodById(routeId, neighId).then(()=>{ closeOverlay(); render(); showToast('محله حذف شد'); }); }
function confirmDeleteShop(id){
  const s = state.shops.find(x=>x.id===id);
  openOverlay('<h3>حذف مغازه</h3><p>مغازه «'+esc(s?s.name:'')+'» و تمام سوابق ویزیت آن حذف شود؟ این عمل قابل بازگشت نیست.</p>'+
    '<div class="btn-row"><button class="btn btn-secondary" data-action="closeOverlay">انصراف</button>'+
    '<button class="btn btn-danger" data-action="confirmDeleteShopYes" data-id="'+esc(id)+'">حذف</button></div>');
}
function doDeleteShop(id){
  deleteShop(id).then(()=>{ closeOverlay(); state.view='list'; render(); showToast('حذف شد'); });
}
function confirmDeleteVisit(shopId, visitId){
  openOverlay('<h3>حذف ویزیت</h3><p>این ویزیت از سوابق حذف شود؟</p>'+
    '<div class="btn-row"><button class="btn btn-secondary" data-action="closeOverlay">انصراف</button>'+
    '<button class="btn btn-danger" data-action="confirmDeleteVisitYes" data-id="'+esc(shopId)+'" data-visit="'+esc(visitId)+'">حذف</button></div>');
}
function doDeleteVisit(shopId, visitId){
  deleteVisit(shopId, visitId).then(()=>{ closeOverlay(); render(); showToast('ویزیت حذف شد'); });
}
function openEditShopSheet(id){
  const shop = state.shops.find(s=>s.id===id);
  if(!shop) return;
  const routeOptions = state.routes.map(r=>'<option value="'+esc(r.id)+'"'+(shop.routeId===r.id?' selected':'')+'>'+esc(r.name)+'</option>').join('');
  openOverlay('<h3>ویرایش مغازه</h3>'+
    '<div class="field-label">نام مغازه</div><input type="text" id="edit-shop-name" value="'+esc(shop.name)+'" style="margin-bottom:12px">'+
    '<div class="field-label">مسیر</div><select id="edit-shop-route" style="width:100%; margin-bottom:12px">'+routeOptions+'</select>'+
    '<button class="btn btn-primary" data-action="saveShopEdit" data-id="'+esc(id)+'">ذخیره تغییرات</button>'+
    '<div style="height:8px"></div><button class="btn btn-secondary" data-action="closeOverlay">انصراف</button>');
}
async function saveShopEditFromSheet(){
  const btn = document.querySelector('[data-action="saveShopEdit"]');
  const id = btn.dataset.id;
  const shop = state.shops.find(s=>s.id===id);
  if(!shop) return;
  const name = (document.getElementById('edit-shop-name').value||'').trim();
  const routeId = document.getElementById('edit-shop-route').value;
  if(!name){ showToast('نام نمی‌تواند خالی باشد'); return; }
  shop.name = name;
  if(routeId !== shop.routeId){ shop.routeId = routeId; shop.neighborhoodId = null; }
  await persistShop(shop);
  closeOverlay();
  render();
  showToast('ذخیره شد ✅');
}

/* ============================================================
   بخش ۱۷: راه‌اندازی اولیه
   ============================================================ */
(async function init(){
  try{
    await openDatabase();
    await loadAllData();
    await ensureDailyTarget();
  } catch(e){
    showToast('خطا در بارگذاری اطلاعات ⚠️');
  }
  resetEntryFormForNew(false);
  render();
})();
</script>
